<section class="card shadow-sm h-100 perfil">

    <div class="avatar">{{ iniciales }}</div>
    <div>
      <h1 class="h3 mb-1">{{ perfil.nombre }}</h1>
      <p class="text-muted mb-3">{{ perfil.titulo }}</p>
      <h2 class="h6 text-uppercase titulo-seccion">Perfil profesional</h2>
      <p class="mb-0">{{ perfil.resumen }}</p>
    </div>
  </div>
</section>
